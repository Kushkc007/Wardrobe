name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short 2>&1 | tee pytest.log
      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### pytest output'
            echo '```'
            tail -n 120 pytest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Syntax check dashboard JavaScript
        run: node --check dashboard/static/app.js

  lint:
    name: Critical lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check organizer dashboard organize.py --select F,E9
